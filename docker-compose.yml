services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  subject-service:
    build: {context: ., dockerfile: subject-service/Dockerfile}
    ports: ["8081:8081"]
    environment: {ASSESSMENT_SERVICE_URL: "http://assessment-service:8082", KAFKA_BOOTSTRAP_SERVERS: "kafka:9092", OPENAI_API_KEY: "${OPENAI_API_KEY:-}"}
    depends_on: [kafka]
  assessment-service:
    build: {context: ., dockerfile: assessment-service/Dockerfile}
    ports: ["8082:8082"]
    environment: {SUBJECT_SERVICE_URL: "http://subject-service:8081", KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"}
    depends_on: [kafka]
  study-activity-service:
    build: {context: ., dockerfile: study-activity-service/Dockerfile}
    ports: ["8083:8083"]
    environment: {SUBJECT_SERVICE_URL: "http://subject-service:8081", KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"}
    depends_on: [kafka]
  planning-service:
    build: {context: ., dockerfile: planning-service/Dockerfile}
    ports: ["8084:8084"]
    environment: {ASSESSMENT_SERVICE_URL: "http://assessment-service:8082", SUBJECT_SERVICE_URL: "http://subject-service:8081", KAFKA_BOOTSTRAP_SERVERS: "kafka:9092", OPENAI_API_KEY: "${OPENAI_API_KEY:-}"}
    depends_on: [kafka, assessment-service]
  frontend:
    image: nginx:1.29-alpine
    ports: ["3000:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on: [subject-service, assessment-service, study-activity-service, planning-service]

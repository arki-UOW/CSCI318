server: {port: 8082}
spring:
  application: {name: assessment-service}
  datasource: {url: "jdbc:h2:file:./data/assessment-db;AUTO_SERVER=TRUE", username: sa, password: ""}
  jpa: {hibernate: {ddl-auto: update}, open-in-view: false}
  cloud:
    stream:
      output-bindings: assessmentEvents-out-0
      bindings:
        assessmentEvents-out-0: {destination: assessment-events, content-type: application/json}
      kafka:
        binder: {brokers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"}
        bindings:
          assessmentEvents-out-0:
            producer:
              sync: true
              messageKeyExpression: headers['eventKey']
              configuration:
                acks: all
                enable.idempotence: true
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
services:
  subject-url: "${SUBJECT_SERVICE_URL:http://localhost:8081}"
  account-url: "${ACCOUNT_SERVICE_URL:http://localhost:8085}"

server: {port: 8081}
spring:
  application: {name: subject-service}
  datasource: {url: "jdbc:h2:file:./data/subject-db;AUTO_SERVER=TRUE", username: sa, password: ""}
  jpa: {hibernate: {ddl-auto: update}, open-in-view: false}
  servlet: {multipart: {max-file-size: 15MB, max-request-size: 15MB}}
  cloud:
    stream:
      output-bindings: subjectEvents-out-0
      bindings:
        subjectEvents-out-0: {destination: subject-events, content-type: application/json}
      kafka:
        binder: {brokers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"}
        bindings:
          subjectEvents-out-0:
            producer:
              sync: true
              messageKeyExpression: headers['eventKey']
              configuration:
                acks: all
                enable.idempotence: true
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
services:
  assessment-url: "${ASSESSMENT_SERVICE_URL:http://localhost:8082}"
  account-url: "${ACCOUNT_SERVICE_URL:http://localhost:8085}"
study:
  ai:
    provider: "${AI_PROVIDER:auto}"
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      model: "${GEMINI_MODEL:gemini-3.6-flash}"
    openai:
      api-key: "${OPENAI_API_KEY:}"
      model: "${OPENAI_MODEL:gpt-4.1-mini}"

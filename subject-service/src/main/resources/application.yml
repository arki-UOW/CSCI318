server: {port: 8081}
spring:
  application: {name: subject-service}
  datasource: {url: "jdbc:h2:file:./data/subject-db;AUTO_SERVER=TRUE", username: sa, password: ""}
  jpa: {hibernate: {ddl-auto: update}, open-in-view: false}
  servlet: {multipart: {max-file-size: 10MB, max-request-size: 10MB}}
  cloud: {stream: {kafka: {binder: {brokers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"}}}}
services: {assessment-url: "${ASSESSMENT_SERVICE_URL:http://localhost:8082}"}
study:
  ai: {api-key: "${OPENAI_API_KEY:}", model: "${OPENAI_MODEL:gpt-4.1-mini}"}
